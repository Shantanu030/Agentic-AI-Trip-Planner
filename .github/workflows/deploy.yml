
name: Deploy TripMate AI to AWS EKS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: trip-planner-cluster
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: trip-planner
  K8S_NAMESPACE: trip-planner
  DEPLOYMENT_NAME: trip-planner
  CONTAINER_NAME: trip-planner

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/trip-planner:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/trip-planner:latest

      - name: Diagnose GitHub OIDC claims
        shell: bash
        run: |
          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          OIDC_TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "Failed to obtain OIDC token"
            echo "$RESPONSE" | jq 'del(.value)'
            exit 1
          fi

          OIDC_TOKEN="$OIDC_TOKEN" python - <<'PY'
          import os
          import json
          import base64

          token = os.environ["OIDC_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ["iss", "aud", "sub", "repository", "ref"]:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::580264101141:role/GitHubActions-EKS-Deploy-Role
          aws-region: ap-south-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name trip-planner-cluster

      - name: Deploy to EKS
        run: |
          kubectl set image deployment/trip-planner \
            trip-planner=${{ secrets.DOCKERHUB_USERNAME }}/trip-planner:${{ github.sha }} \
            -n trip-planner

          kubectl rollout status deployment/trip-planner \
            -n trip-planner \
            --timeout=180s
